<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Street Heat</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#151a21">
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; padding: 0; overflow: hidden; background: #151a21;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    height: 100%; width: 100%; touch-action: none;
  }
  #game { display: block; background: #3a3a3a; }
  #hud {
    position: fixed; top: 0; left: 0; right: 0; padding: 12px;
    display: flex; justify-content: space-between; align-items: flex-start;
    pointer-events: none; color: #fff; text-shadow: 0 1px 3px rgba(0,0,0,.8);
    font-weight: 700; font-size: 14px;
  }
  #wanted { display: flex; gap: 2px; font-size: 20px; }
  #cash { font-size: 18px; }
  #missionBanner {
    position: fixed; top: 50%; left: 50%; transform: translate(-50%,-50%);
    background: rgba(0,0,0,.75); color: #fff; padding: 14px 22px; border-radius: 10px;
    font-size: 16px; font-weight: 700; opacity: 0; transition: opacity .3s;
    pointer-events: none; text-align: center; max-width: 80vw;
  }
  #missionBanner.show { opacity: 1; }
  #controls {
    position: fixed; bottom: 0; left: 0; right: 0; padding: 18px;
    display: flex; justify-content: space-between; align-items: flex-end;
    pointer-events: none;
  }
  #joystickZone {
    width: 130px; height: 130px; border-radius: 50%;
    background: rgba(255,255,255,.12); border: 2px solid rgba(255,255,255,.3);
    position: relative; pointer-events: all;
  }
  #joystickThumb {
    width: 55px; height: 55px; border-radius: 50%;
    background: rgba(255,255,255,.55);
    position: absolute; top: 37px; left: 37px;
  }
  #actionBtn {
    width: 78px; height: 78px; border-radius: 50%;
    background: rgba(255, 90, 90, .8); color: #fff; font-weight: 800; font-size: 13px;
    border: 2px solid rgba(255,255,255,.4); pointer-events: all;
  }
  #startScreen {
    position: fixed; inset: 0; background: #151a21; color: #fff;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    text-align: center; padding: 24px; z-index: 10;
  }
  #startScreen h1 { font-size: 32px; margin-bottom: 4px; letter-spacing: 1px; }
  #startScreen p { opacity: .7; max-width: 320px; line-height: 1.5; font-size: 14px; }
  #startScreen button {
    margin-top: 22px; padding: 14px 34px; font-size: 16px; font-weight: 700;
    background: #ff5a5a; color: #fff; border: none; border-radius: 8px;
  }
</style>
</head>
<body>

<div id="startScreen">
  <h1>🚗 STREET HEAT</h1>
  <p>Drag anywhere to move. Tap ENTER/EXIT to hop in and out of cars. Deliver packages before the cops catch you. Build your empire.</p>
  <button id="startBtn">START GAME</button>
</div>

<canvas id="game"></canvas>

<div id="hud">
  <div id="cash">💵 $0</div>
  <div id="wanted"></div>
</div>
<div id="missionBanner"></div>

<div id="controls">
  <div id="joystickZone"><div id="joystickThumb"></div></div>
  <button id="actionBtn">ENTER</button>
</div>

<script>
// ---------- SETUP ----------
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
function resize(){ canvas.width = innerWidth; canvas.height = innerHeight; }
resize(); addEventListener('resize', resize);

const WORLD = { w: 3000, h: 3000 };
const camera = { x: 0, y: 0 };

let cash = 0, wanted = 0;
let state = 'menu'; // menu | playing

// ---------- WORLD: roads + buildings ----------
const blockSize = 300;
const buildings = [];
for (let x = 0; x < WORLD.w; x += blockSize) {
  for (let y = 0; y < WORLD.h; y += blockSize) {
    if (Math.random() < 0.75) {
      buildings.push({
        x: x + 30 + Math.random()*20, y: y + 30 + Math.random()*20,
        w: blockSize - 90 - Math.random()*30, h: blockSize - 90 - Math.random()*30,
        color: `hsl(${Math.random()*40+20}, 20%, ${25+Math.random()*15}%)`
      });
    }
  }
}

// ---------- ENTITIES ----------
const player = {
  x: WORLD.w/2, y: WORLD.h/2, angle: 0, speed: 0,
  maxSpeed: 3.2, size: 14, inCar: null
};

const cars = [];
for (let i = 0; i < 14; i++) {
  cars.push({
    x: Math.random()*WORLD.w, y: Math.random()*WORLD.h,
    angle: Math.random()*Math.PI*2, speed: 0, maxSpeed: 7,
    w: 34, h: 18, color: ['#c0392b','#2980b9','#f1c40f','#27ae60','#8e44ad'][i%5],
    occupied: false
  });
}

const cops = [];
function spawnCop() {
  cops.push({
    x: player.x + (Math.random()-0.5)*600, y: player.y + (Math.random()-0.5)*600,
    angle: 0, speed: 0, maxSpeed: 6.6, w: 32, h: 17
  });
}

let mission = null;
function newMission() {
  const dropX = Math.random()*WORLD.w, dropY = Math.random()*WORLD.h;
  mission = { x: dropX, y: dropY, reward: 100 + Math.floor(Math.random()*150) };
  showBanner(`New job: deliver to the marked zone. Reward $${mission.reward}`);
}
function showBanner(text, ms=2600) {
  const el = document.getElementById('missionBanner');
  el.textContent = text; el.classList.add('show');
  clearTimeout(showBanner._t);
  showBanner._t = setTimeout(()=>el.classList.remove('show'), ms);
}

// ---------- CONTROLS (virtual joystick) ----------
const joyZone = document.getElementById('joystickZone');
const joyThumb = document.getElementById('joystickThumb');
let joy = { active: false, dx: 0, dy: 0 };

function joyStart(e){ joy.active = true; moveJoy(e); }
function moveJoy(e){
  if (!joy.active) return;
  const t = e.touches ? e.touches[0] : e;
  const rect = joyZone.getBoundingClientRect();
  let dx = t.clientX - (rect.left + rect.width/2);
  let dy = t.clientY - (rect.top + rect.height/2);
  const dist = Math.min(Math.hypot(dx,dy), 45);
  const ang = Math.atan2(dy,dx);
  dx = Math.cos(ang)*dist; dy = Math.sin(ang)*dist;
  joyThumb.style.left = (37+dx)+'px'; joyThumb.style.top = (37+dy)+'px';
  joy.dx = dx/45; joy.dy = dy/45;
}
function joyEnd(){ joy.active=false; joy.dx=0; joy.dy=0; joyThumb.style.left='37px'; joyThumb.style.top='37px'; }
joyZone.addEventListener('touchstart', joyStart);
joyZone.addEventListener('touchmove', moveJoy);
joyZone.addEventListener('touchend', joyEnd);
joyZone.addEventListener('mousedown', joyStart);
addEventListener('mousemove', moveJoy);
addEventListener('mouseup', joyEnd);

document.getElementById('actionBtn').addEventListener('click', toggleCar);
function toggleCar(){
  if (player.inCar) {
    player.inCar.occupied = false;
    player.x = player.inCar.x; player.y = player.inCar.y;
    player.inCar = null;
    document.getElementById('actionBtn').textContent = 'ENTER';
  } else {
    let nearest = null, nd = 60;
    for (const c of cars) {
      if (c.occupied) continue;
      const d = Math.hypot(c.x-player.x, c.y-player.y);
      if (d < nd) { nd = d; nearest = c; }
    }
    if (nearest) {
      nearest.occupied = true; player.inCar = nearest;
      document.getElementById('actionBtn').textContent = 'EXIT';
    }
  }
}

// ---------- GAME LOOP ----------
function update() {
  const obj = player.inCar || player;
  const maxSpd = player.inCar ? player.inCar.maxSpeed : player.maxSpeed;
  const inputMag = Math.hypot(joy.dx, joy.dy);

  if (inputMag > 0.15) {
    const targetAngle = Math.atan2(joy.dy, joy.dx);
    obj.angle = targetAngle;
    obj.speed = Math.min(maxSpd, (obj.speed||0) + 0.4);
  } else {
    obj.speed = Math.max(0, (obj.speed||0) - 0.3);
  }
  obj.x += Math.cos(obj.angle) * obj.speed;
  obj.y += Math.sin(obj.angle) * obj.speed;
  obj.x = Math.max(20, Math.min(WORLD.w-20, obj.x));
  obj.y = Math.max(20, Math.min(WORLD.h-20, obj.y));

  if (player.inCar) { player.x = player.inCar.x; player.y = player.inCar.y; }

  // mission check
  if (mission) {
    const d = Math.hypot(player.x-mission.x, player.y-mission.y);
    if (d < 50) {
      cash += mission.reward;
      showBanner(`Delivered! +$${mission.reward}`);
      mission = null;
      setTimeout(newMission, 1800);
    }
  }

  // cop chase logic
  cops.forEach(cop => {
    const d = Math.hypot(cop.x-player.x, cop.y-player.y);
    if (wanted > 0 && d < 900) {
      cop.angle = Math.atan2(player.y-cop.y, player.x-cop.x);
      cop.speed = Math.min(cop.maxSpeed, (cop.speed||0)+0.35);
    } else {
      cop.speed = Math.max(0, (cop.speed||0)-0.2);
    }
    cop.x += Math.cos(cop.angle)*cop.speed;
    cop.y += Math.sin(cop.angle)*cop.speed;
    if (d < 34 && wanted > 0) {
      wanted = Math.max(0, wanted-1);
      cash = Math.max(0, cash - 40);
      showBanner('Busted! -$40', 1500);
      cop.x += (Math.random()-0.5)*300; cop.y += (Math.random()-0.5)*300;
    }
  });

  camera.x = player.x - canvas.width/2;
  camera.y = player.y - canvas.height/2;

  document.getElementById('cash').textContent = `💵 $${cash}`;
  document.getElementById('wanted').textContent = '⭐'.repeat(wanted) + '☆'.repeat(5-wanted);
}

function draw() {
  ctx.fillStyle = '#4a4a4a';
  ctx.fillRect(0,0,canvas.width,canvas.height);

  ctx.save();
  ctx.translate(-camera.x, -camera.y);

  // roads grid
  ctx.strokeStyle = '#666'; ctx.lineWidth = 40;
  for (let x=0; x<WORLD.w; x+=blockSize){ ctx.beginPath(); ctx.moveTo(x,0); ctx.lineTo(x,WORLD.h); ctx.stroke(); }
  for (let y=0; y<WORLD.h; y+=blockSize){ ctx.beginPath(); ctx.moveTo(0,y); ctx.lineTo(WORLD.w,y); ctx.stroke(); }

  // buildings
  buildings.forEach(b => { ctx.fillStyle = b.color; ctx.fillRect(b.x,b.y,b.w,b.h); });

  // mission marker
  if (mission) {
    ctx.strokeStyle = '#ffd23f'; ctx.lineWidth = 4;
    ctx.beginPath(); ctx.arc(mission.x, mission.y, 30 + Math.sin(Date.now()/200)*6, 0, 7); ctx.stroke();
  }

  // cars
  cars.forEach(c => {
    if (c === player.inCar) return;
    ctx.save(); ctx.translate(c.x,c.y); ctx.rotate(c.angle);
    ctx.fillStyle = c.color; ctx.fillRect(-c.w/2,-c.h/2,c.w,c.h);
    ctx.restore();
  });

  // cop cars
  cops.forEach(cop => {
    ctx.save(); ctx.translate(cop.x,cop.y); ctx.rotate(cop.angle);
    ctx.fillStyle = (Math.floor(Date.now()/200)%2===0) ? '#3454ff' : '#ff3535';
    ctx.fillRect(-cop.w/2,-cop.h/2,cop.w,cop.h);
    ctx.restore();
  });

  // player or player's car
  if (player.inCar) {
    const c = player.inCar;
    ctx.save(); ctx.translate(c.x,c.y); ctx.rotate(c.angle);
    ctx.fillStyle = '#ffffff'; ctx.fillRect(-c.w/2,-c.h/2,c.w,c.h);
    ctx.restore();
  } else {
    ctx.save(); ctx.translate(player.x,player.y); ctx.rotate(player.angle);
    ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(0,0,player.size,0,7); ctx.fill();
    ctx.restore();
  }

  ctx.restore();
}

function loop(){ if(state==='playing'){ update(); draw(); } requestAnimationFrame(loop); }

// wanted level ticks up slowly while driving fast near cops, just for flavor
setInterval(()=>{
  if (state!=='playing') return;
  if (player.inCar && player.inCar.speed > 5 && Math.random()<0.15) wanted = Math.min(5, wanted+1);
}, 2000);

for (let i=0;i<3;i++) spawnCop();

document.getElementById('startBtn').addEventListener('click', () => {
  document.getElementById('startScreen').style.display = 'none';
  state = 'playing';
  newMission();
  loop();
});

// register service worker for offline/PWA support
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('service-worker.js').catch(()=>{});
}
</script>
</body>
</html>
